# 推送 v<版本> tag 时打包本游戏、签名发布清单并发布 GitHub Release，供桌游大厅的游戏商店下载。
# 打包脚本来自大厅仓库（tools/release/pack-mod.mjs），签名公钥以大厅仓库的 lib/update-keys.json 为准。
# 需要的仓库 Secret：
#   BOARDGAME_UPDATE_PRIVATE_KEY  与大厅相同的更新签名私钥
#   HALL_REPO_TOKEN               可选；大厅仓库为私有时，提供有读取权限的 token
# 可选的 Cloudflare R2 同步：仓库变量 R2_BUCKET、R2_ACCOUNT_ID + Secret R2_ACCESS_KEY_ID、R2_SECRET_ACCESS_KEY
name: Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: mod
      - uses: actions/checkout@v4
        with:
          repository: Dr-Liao/boardgame-hall-ai
          path: hall
          token: ${{ secrets.HALL_REPO_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Release notes from tag
        working-directory: mod
        run: |
          git fetch --depth=1 origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > ../notes.txt
      - name: Pack and sign
        env:
          BOARDGAME_UPDATE_PRIVATE_KEY: ${{ secrets.BOARDGAME_UPDATE_PRIVATE_KEY }}
        run: node hall/tools/release/pack-mod.mjs mod --out=dist --tag="$GITHUB_REF_NAME" --notes-file=notes.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # 重跑时 Release 已存在：改用已发布的附件，保证 R2 与 GitHub 上的文件一致。
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            rm -rf dist && gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" -D dist
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "诡镇奇谈 $GITHUB_REF_NAME" --notes-file notes.txt
          fi
      - name: Mirror release to R2
        if: ${{ vars.R2_BUCKET != '' }}
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node hall/tools/release/r2.mjs release dist --dir=arkhamhorror --tag="$GITHUB_REF_NAME"
